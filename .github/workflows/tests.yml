name: Tests

on:
  push:
    branches: [main, develop]
    paths: &python
      - "**.py"
      - "requirements*.txt"
      - "pytest.ini"
      - ".github/workflows/tests.yml"
  pull_request:
    paths: *python

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest -rs
